function setState(partial) {
  Object.assign(state, partial);
  render();
}

// ===== NOTIFICATION =====
function notify(msg, type) {
  setState({ notification: { msg, type } });
  setTimeout(() => { if (state.notification) setState({ notification: null }); }, 4000);
}

// ===== HELPERS =====
function slideTimer() {
  setInterval(() => {
    setState({ slideIdx: (state.slideIdx + 1) % SLIDES.length });
  }, 8000);
}
slideTimer();

// ===== RENDER =====
function render() {
  const root = document.getElementById('root');
  const s = state;
  let html = '';

  // Notification
  if (s.notification) {
    const isErr = s.notification.type === 'error';
    html += '<div class="fixed top-4 right-4 z-50 p-4 rounded-lg shadow-2xl flex items-center gap-3 animate-bounce-alt transition-all ' + (isErr ? 'bg-red-600 text-white' : 'bg-green-600 text-white') + '">';
    html += isErr ? ic('Shield','w-5 h-5') : ic('CheckCircle','w-5 h-5');
    html += '<span class="font-medium text-sm">' + s.notification.msg + '</span></div>';
  }

  if (s.view === 'landing') html += renderLanding();
  else if (s.view === 'login') html += renderLogin();
  else if (s.view === 'payment' && s.courseToPurchase) html += renderPayment();
  else if (s.view === 'dashboard' && s.user) html += renderDashboard();
  else if (s.view === 'viewer' && s.selectedCourse) html += renderViewer();
  else html += renderLanding();

  root.innerHTML = html;
  attachEvents();
}

function sidebarBtn(tab, icon, label, isActive, badge, badgeText) {
  const active = state.tab === tab;

  b += `<div class="flex items-center gap-3">${ic(icon,'w-4 h-4')}<span>${label}</span></div>`;
  if (badge != null && icon === 'Layers') b += `<span class="bg-red-500 text-white font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center">${badge}</span>`;

  b += '</button>';
  return b;
}

  </div>
</div>`;
}

// ===== EVENTS =====
function attachEvents() {
  // Landing: login/register buttons
  document.querySelectorAll('.btn-login').forEach(el => el.addEventListener('click', () => { setState({ view: 'login', registering: false }); }));
  document.querySelectorAll('.btn-register').forEach(el => el.addEventListener('click', () => { setState({ view: 'login', registering: true }); }));
  document.querySelectorAll('.btn-back-landing').forEach(el => el.addEventListener('click', () => { setState({ view: 'landing' }); }));

  // Login form
  const loginForm = document.querySelector('.login-form');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const isReg = state.registering;
      const name = state.username || 'Carlos Ram\u00edrez';
      const fakeUser = {
        name: name,
        email: name.toLowerCase().replace(/\\s/g, '') + '@ceap.edu.sv',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80',
        currentProgram: isReg ? 'Matriculado CEAP Virtual' : 'Diplomado en Gesti\u00f3n de Proyectos'
      };
      if (isReg) {
        setState({ user: fakeUser });
        notify('Cuenta creada con \u00e9xito. \u00a1Bienvenido a CEAP!', 'success');
        if (state.courseToPurchase) { setState({ view: 'payment' }); } else { setState({ view: 'dashboard', tab: 'dashboard' }); }
      } else {
        setState({ user: fakeUser, view: 'dashboard', tab: 'dashboard' });
        notify('\u00a1Bienvenido de nuevo, ' + fakeUser.name + '!', 'success');
      }
    });
    const unameInput = document.querySelector('.input-username');
    if (unameInput) unameInput.addEventListener('input', (e) => { setState({ username: e.target.value }); });
    const pwInput = document.querySelector('.input-password');
    if (pwInput) pwInput.addEventListener('input', (e) => { setState({ password: e.target.value }); });
    document.querySelectorAll('.btn-toggle-pw').forEach(el => el.addEventListener('click', () => { setState({ showPassword: !state.showPassword }); }));
    document.querySelectorAll('.btn-toggle-register').forEach(el => el.addEventListener('click', () => { setState({ registering: !state.registering }); }));
  }

  // Google button
  document.querySelectorAll('.btn-google').forEach(el => el.addEventListener('click', () => {
    const fakeUser = {
      name: 'Carlos Ram\u00edrez',
      email: 'carlos.ramirez@ceap.edu.sv',
      avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&h=120&q=80',
      currentProgram: 'Diplomado en Gesti\u00f3n de Proyectos'
    };
    setState({ user: fakeUser });
    if (state.courseToPurchase) { setState({ view: 'payment' }); } else { setState({ view: 'dashboard', tab: 'dashboard' }); }
    notify('Sesi\u00f3n iniciada correctamente con Google.', 'success');
  }));

  // Purchase buttons
  document.querySelectorAll('.btn-purchase').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.id;
    const course = state.courses.find(c => c.id === id);
    if (course) {
      setState({ courseToPurchase: course });
      if (!state.user) { setState({ view: 'login', registering: true }); notify('Por favor, crea una cuenta para completar tu inscripci\u00f3n.', 'info'); }
      else { setState({ view: 'payment' }); }
    }
  }));

  // Payment form
  const payForm = document.querySelector('.payment-form');
  if (payForm) {
    payForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!state.courseToPurchase) return;
      const updated = state.courses.map(c => c.id === state.courseToPurchase.id ? { ...c, progress: 10 } : c);
      setState({ courses: updated });
      notify('\u00a1Inscripci\u00f3n exitosa al curso: ' + state.courseToPurchase.title + '!', 'success');
      setState({ courseToPurchase: null, view: 'dashboard', tab: 'cursos' });
    });
  }
  document.querySelectorAll('.btn-cancel-payment').forEach(el => el.addEventListener('click', () => { setState({ courseToPurchase: null, view: 'landing' }); }));

  // Sidebar tabs
  document.querySelectorAll('.sidebar-btn').forEach(el => el.addEventListener('click', () => {
    const tab = el.dataset.tab;
    if (tab) setState({ tab });
  }));
  document.querySelectorAll('.sidebar-disabled').forEach(el => el.addEventListener('click', () => {
    notify('Funcionalidad disponible pr\u00f3ximamente.', 'info');
  }));

  // Tab buttons (inline)
  document.querySelectorAll('.tab-btn').forEach(el => el.addEventListener('click', () => {
    const tab = el.dataset.tab;
    if (tab) setState({ tab });
  }));

  // Slide dots
  document.querySelectorAll('.slide-dot').forEach(el => el.addEventListener('click', () => {
    setState({ slideIdx: parseInt(el.dataset.slide) });
  }));

  // Open viewer
  document.querySelectorAll('.btn-open-viewer').forEach(el => el.addEventListener('click', () => {
    const id = el.dataset.id;
    const course = state.courses.find(c => c.id === id);
    if (course) setState({ selectedCourse: course, view: 'viewer' });
  }));

  // Back from viewer
  document.querySelectorAll('.btn-back-dashboard').forEach(el => el.addEventListener('click', () => {
    setState({ view: 'dashboard' });
  }));

  // Logout
  document.querySelectorAll('.btn-logout').forEach(el => el.addEventListener('click', () => {
    setState({ user: null, view: 'landing', tab: 'dashboard' });
    notify('Sesi\u00f3n cerrada con \u00e9xito.', 'success');
  }));

  // Support form
  const supportForm = document.querySelector('.support-form');
  if (supportForm) {
    supportForm.addEventListener('submit', (e) => {
      e.preventDefault();
      notify('Su ticket de soporte t\u00e9cnico fue creado. Responderemos a su correo registrado en menos de 2 horas.', 'success');
      supportForm.querySelector('textarea').value = '';
    });
  }
}

// ===== INIT =====
render();
</script>
