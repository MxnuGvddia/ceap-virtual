        }else{
          setState({user:fu,preferences:null,view:nextView,tab:nextView==='dashboard'?'dashboard':state.tab});
        }
        // Save to Drive right now
        const saveData={xp:state.xp,level:state.level,streak:state.streak,lastLoginDate:state.lastLoginDate,notifList:state.notifList,unreadNotifs:state.unreadNotifs,settings:state.settings,user:state.user,preferences:state.preferences};
        saveToDriveWithToken(saveData,tr);
      }).catch(()=>{
        setState({user:fu,preferences:state.preferences||null,view:nextView,tab:nextView==='dashboard'?'dashboard':state.tab});
      });
    },()=>{
      setState({user:fu,preferences:state.preferences||null,view:nextView,tab:nextView==='dashboard'?'dashboard':state.tab});
    });
  }else{
    // Login: no Drive popup, just use localStorage
    setState({user:fu,preferences:state.preferences||null,view:nextView,tab:nextView==='dashboard'?'dashboard':state.tab});

function initGoogleGIS(){
  if(typeof google!=='undefined'&&google.accounts){
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredentialResponse,auto_select:false});
  }
}

function getGoogleToken(scopes,cb,ecb,silent){
  if(typeof google==='undefined'||!google.accounts)return;
  if(googleAccessToken&&cb){cb({access_token:googleAccessToken});return;}
  const t=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:scopes||'https://www.googleapis.com/auth/drive.file',callback:r=>{googleAccessToken=r.access_token;if(cb)cb(r);},error_callback:()=>{if(ecb)ecb();}});
  if(silent){try{t.requestAccessToken({prompt:'none'})}catch(e){if(ecb)ecb();}}
  else t.requestAccessToken();
}

const DRIVE_FOLDER_ID='1oSaPl-N7THDUdGqu9MQk1KZM9U_qGmAS';
const DRIVE_FILE_NAME='ceap_user_data.json';
let driveFileId=localStorage.getItem('ceap_drive_file_id');
let driveSaveTimer=null;

function saveToDrive(data){
  return new Promise((resolve,reject)=>{
    const doSave=tr=>{
      const b=new Blob([JSON.stringify(data)],{type:'application/json'});
      const fd=new FormData();
      fd.append('metadata',new Blob([JSON.stringify({})],{type:'application/json'}));
      fd.append('file',b);
      if(driveFileId){
        fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`,{method:'PATCH',headers:{Authorization:'Bearer '+tr.access_token},body:fd})
          .then(r=>r.json()).then(resolve).catch(reject);
      }else{
        fd.set('metadata',new Blob([JSON.stringify({name:DRIVE_FILE_NAME,parents:[DRIVE_FOLDER_ID]})],{type:'application/json'}));
        fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tr.access_token},body:fd})
          .then(r=>r.json()).then(d=>{driveFileId=d.id;if(d.id)localStorage.setItem('ceap_drive_file_id',d.id);resolve(d);}).catch(reject);
      }
    };
    if(googleAccessToken)doSave({access_token:googleAccessToken});
    else getGoogleToken('https://www.googleapis.com/auth/drive.file',doSave,reject);
  });
}

function saveToDriveWithToken(data,tr){
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const fd=new FormData();
  fd.append('metadata',new Blob([JSON.stringify({})],{type:'application/json'}));
  fd.append('file',b);
  return new Promise((resolve,reject)=>{
    if(driveFileId){
      fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`,{method:'PATCH',headers:{Authorization:'Bearer '+tr.access_token},body:fd})
        .then(r=>r.json()).then(resolve).catch(reject);
    }else{
      fd.set('metadata',new Blob([JSON.stringify({name:DRIVE_FILE_NAME,parents:[DRIVE_FOLDER_ID]})],{type:'application/json'}));
      fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tr.access_token},body:fd})
        .then(r=>r.json()).then(d=>{driveFileId=d.id;if(d.id)localStorage.setItem('ceap_drive_file_id',d.id);resolve(d);}).catch(reject);
    }
  });
}

function loadFromDriveWithToken(tr){
  const h={headers:{Authorization:'Bearer '+tr.access_token}};
  return new Promise((resolve,reject)=>{
    if(driveFileId){
      fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,h).then(r=>r.json()).then(resolve).catch(()=>resolve(null));
    }else{
      fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE_NAME}'+and+'${DRIVE_FOLDER_ID}'+in+parents&fields=files(id)`,h)
        .then(r=>r.json()).then(d=>{
          if(d.files&&d.files.length>0){driveFileId=d.files[0].id;localStorage.setItem('ceap_drive_file_id',driveFileId);
            return fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,h).then(r=>r.json());}
          resolve(null);
        }).then(resolve).catch(()=>resolve(null));
    }
  });
}

function renderCalendarioTab(){
  const s=state,month=s.calendarMonth,year=s.calendarYear;
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  let cells='',day=1;
  for(let i=0;i<42;i++){
    if(i<firstDay||day>daysInMonth){cells+='<div class="p-2 text-center text-[10px] text-slate-300"></div>';}
    else{
      const ev=EVENTS.filter(e=>e.date===day);
      cells+=`<div class="p-2 text-center rounded-lg text-xs font-semibold ${ev.length?'bg-[#4bae4f]/10 text-[#021b3d]':'text-slate-600 hover:bg-slate-100'} transition-colors">${day}${ev.length?`<div class="flex justify-center gap-0.5 mt-0.5">${ev.map(e=>`<span class="w-1.5 h-1.5 rounded-full ${e.color.split(' ')[0]}"></span>`).join('')}</div>`:''}</div>`;

  }
  return `
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div class="space-y-1"><h3 class="text-2xl font-black text-[#021b3d]">Calendario Escolar</h3><p class="text-xs text-slate-500">${MONTHS[month]} ${year}</p></div>

      <button class="btn-cal-prev bg-white border border-slate-200 hover:bg-slate-50 p-2 rounded-lg text-xs transition-all">${ic('ChevronLeft','w-4 h-4')}</button>
      <button class="btn-cal-next bg-white border border-slate-200 hover:bg-slate-50 p-2 rounded-lg text-xs transition-all">${ic('ChevronRight','w-4 h-4')}</button>
    </div>
  </div>
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
    <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200">${DAYS.map(d=>`<div class="p-3 text-center text-[10px] font-black uppercase text-slate-500 tracking-wider">${d}</div>`).join('')}</div>
    <div class="grid grid-cols-7">${cells}</div>
  </div>
  <div class="space-y-3">
    <h4 class="font-black text-sm text-[#021b3d]">Eventos del Mes</h4>

          <div class="bg-slate-50 rounded-xl p-4 text-center"><p class="text-2xl font-black text-[#021b3d]">🔥 ${s.streak}</p><p class="text-[10px] text-slate-500 font-bold">Racha</p></div>
          <div class="bg-slate-50 rounded-xl p-4 text-center"><p class="text-2xl font-black text-[#021b3d]">${s.notifList.length}</p><p class="text-[10px] text-slate-500 font-bold">Notificaciones</p></div>
        </div>
      </div>
      <div class="border-t border-slate-200 pt-6 space-y-4">
        <h4 class="font-black text-sm text-[#021b3d] flex items-center gap-2">${ic('HelpCircle','w-4 h-4 text-blue-500')} Acerca de</h4>
        <p class="text-xs text-slate-500">CEAP Virtual v2.0 — Plataforma educativa especializada en administración de proyectos.</p>
        <p class="text-xs text-slate-400">© 2026 CEAP - Centro Especializado en Administración de Proyectos.</p>
      </div>
    </div>
  </div>
</div>`;}

  const c=state.selectedCourse;
  return `
<div class="flex-1 flex flex-col bg-slate-900 text-white min-h-screen">

          <h4 class="font-extrabold text-lg text-white">Clase Abierta en Línea</h4>

      </div>
      <div class="max-w-4xl mx-auto w-full pt-6 space-y-2">

    <div class="lg:col-span-4 bg-[#0a1e38] border-l border-slate-800 p-6 space-y-6">
      <h4 class="font-black text-sm uppercase tracking-wider text-slate-400">Contenido del Diplomado</h4>
      <div class="space-y-3">
        ${c.modules.map((mod,idx)=>`
          <div class="module-item p-4 rounded-xl border cursor-pointer transition-all ${mod.completed?'bg-[#021b3d]/40 border-emerald-500/30':'bg-slate-800/50 border-slate-700/50 hover:bg-slate-800'}" data-idx="${idx}" data-course="${c.id}">
            <div class="flex justify-between items-start gap-3">
              <div class="space-y-1 text-left">
                <span class="text-[9px] uppercase font-bold text-slate-500">Unidad ${idx+1}</span>
                <h5 class="font-bold text-xs text-white leading-snug">${mod.title}</h5>

              ${mod.completed?'<span class="bg-emerald-500 text-[#021b3d] text-[8px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">Completado</span>':'<span class="bg-slate-700 text-slate-300 text-[8px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">Pendiente</span>'}

      </div>
      <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
        <h5 class="font-extrabold text-xs text-white">Material Complementario</h5>

        <button class="w-full bg-[#4bae4f] hover:bg-emerald-500 text-[#021b3d] font-bold py-2 rounded-lg text-xs transition-colors">Descargar Recursos (.zip)</button>
      </div>

function attachEvents(){
  // Landing login/register
  document.querySelectorAll('.btn-login').forEach(el=>el.addEventListener('click',()=>{setState({view:'login',registering:false})}));
  document.querySelectorAll('.btn-register').forEach(el=>el.addEventListener('click',()=>{setState({view:'login',registering:true})}));
  document.querySelectorAll('.btn-back-landing').forEach(el=>el.addEventListener('click',()=>{setState({view:'landing'})}));

  // Login form
  const lf=document.querySelector('.login-form');
  if(lf){
    lf.addEventListener('submit',e=>{
      e.preventDefault();
      const isReg=state.registering;
      const nameInput=document.querySelector('.input-username');
      const name=nameInput?nameInput.value.trim():'Carlos Ramírez';
      const fu={name,email:name.toLowerCase().replace(/\s/g,'')+'@ceap.edu.sv',phone:'',avatar:'',currentProgram:'',createdAt:Date.now(),lastLogin:Date.now(),registered:true};
      if(isReg){addXP(50);notify('Cuenta creada con éxito. +50 XP','success');setState({user:fu,view:state.courseToPurchase?'payment':'preferences'});}
      else{checkStreak();addXP(10);setState({user:fu,view:!state.preferences?'preferences':'dashboard',tab:'dashboard'});notify('¡Bienvenido de nuevo, '+fu.name+'! +10 XP','success');}
    });
    document.querySelectorAll('.btn-toggle-pw').forEach(el=>el.addEventListener('click',function(){
      const pw=document.querySelector('.input-password');
      if(!pw)return;
      const t=pw.getAttribute('type')==='password'?'text':'password';
      pw.setAttribute('type',t);
      this.innerHTML=t==='password'?I.Eye:I.EyeOff;
    }));
    document.querySelectorAll('.btn-toggle-register').forEach(el=>el.addEventListener('click',()=>setState({registering:!state.registering})));
  }

  // Google Sign-In (GIS)
  const gContainer=document.getElementById('google-button-container');
  if(gContainer&&typeof google!=='undefined'&&google.accounts){
    google.accounts.id.renderButton(gContainer,{
      type:'standard',shape:'pill',theme:'outline',
      text:'continue_with',size:'large',width:gContainer.offsetWidth||320,
      logo_alignment:'left',
    });

  }

  // Preferences form
  const pf_=document.querySelector('.preferences-form');
  if(pf_){
    document.querySelectorAll('.pref-option').forEach(el=>el.addEventListener('click',function(){
      const group=this.closest('[data-group]');
      if(!group)return;
      group.querySelectorAll('.pref-option').forEach(o=>{
        o.classList.remove('bg-[#4bae4f]/20','border-[#4bae4f]','text-white');
        o.classList.add('bg-slate-800/60','border-slate-700/60','text-slate-400');
      });
      this.classList.remove('bg-slate-800/60','border-slate-700/60','text-slate-400');
      this.classList.add('bg-[#4bae4f]/20','border-[#4bae4f]','text-white');
      const rb=this.querySelector('input[type="radio"]');
      if(rb)rb.checked=true;
    }));
    pf_.addEventListener('submit',e=>{
      e.preventDefault();
      const area=document.querySelector('input[name="pref-area"]:checked');
      const modalidad=document.querySelector('input[name="pref-modalidad"]:checked');
      const horario=document.querySelector('input[name="pref-horario"]:checked');
      const nivel=document.querySelector('input[name="pref-nivel"]:checked');
      setState({preferences:{area:area?.value||'',modalidad:modalidad?.value||'',horario:horario?.value||'',nivel:nivel?.value||''}});
      addXP(25);
      if(state.courseToPurchase)setState({view:'payment'});
      else setState({view:'dashboard',tab:'dashboard'});
      notify('Preferencias guardadas. +25 XP','success');
    });
    document.querySelectorAll('.btn-skip-preferences').forEach(el=>el.addEventListener('click',()=>{
      setState({preferences:{area:'',modalidad:'',horario:'',nivel:''}});
      if(state.courseToPurchase)setState({view:'payment'});
      else setState({view:'dashboard',tab:'dashboard'});
    }));
  }

  // Purchase
  document.querySelectorAll('.btn-purchase').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.id,course=state.courses.find(c=>c.id===id);
    if(course){setState({courseToPurchase:course});if(!state.user){setState({view:'login',registering:true});notify('Por favor, crea una cuenta para completar tu inscripción.','info');}else setState({view:'payment'});}
  }));

  // Payment form & methods
  const pf=document.querySelector('.payment-form');
  if(pf){
    pf.addEventListener('submit',e=>{
      e.preventDefault();if(!state.courseToPurchase)return;
      const updated=state.courses.map(c=>c.id===state.courseToPurchase.id?{...c,progress:10}:c);
      setState({courses:updated});notify('¡Inscripción exitosa al curso: '+state.courseToPurchase.title+'!','success');
      setState({courseToPurchase:null,view:'dashboard',tab:'cursos'});
    });
  }
  document.querySelectorAll('.btn-cancel-payment').forEach(el=>el.addEventListener('click',()=>setState({courseToPurchase:null,view:'landing'})));
  document.querySelectorAll('.btn-pay-method').forEach(el=>el.addEventListener('click',()=>setState({payMethod:el.dataset.method})));
  document.querySelectorAll('.btn-pay-transfer').forEach(el=>el.addEventListener('click',()=>{notify('Recibimos tu solicitud. Te contactaremos en menos de 24 horas.','success');}));
  document.querySelectorAll('.btn-pay-paypal').forEach(el=>el.addEventListener('click',()=>{notify('Redirigiendo a PayPal para completar el pago...','info');}));

  // Sidebar
  document.querySelectorAll('.sidebar-btn').forEach(el=>el.addEventListener('click',()=>{
    const t=el.dataset.tab;
    if(t==='perfil'){setState({view:'profile',menuOpen:false});}
    else if(t)setState({tab:t,menuOpen:false});
  }));

  // Settings: save notification preferences
  document.querySelectorAll('.input-setting-email').forEach(el=>el.addEventListener('change',function(){
    setState({settings:{...state.settings,emailNotifs:this.checked}});
    notify('Preferencias de notificación actualizadas.','success');
  }));
  document.querySelectorAll('.input-setting-desktop').forEach(el=>el.addEventListener('change',function(){
    setState({settings:{...state.settings,desktopNotifs:this.checked}});
    notify('Preferencias de notificación actualizadas.','success');
  }));
  // Notification bell: mark as read
  document.querySelectorAll('.btn-notif').forEach(el=>el.addEventListener('click',()=>{
    if(state.unreadNotifs>0){
      setState({unreadNotifs:0});
      notify(state.notifList.length+' notificaciones en total.','info');
    } else notify('No tienes notificaciones nuevas.','info');
  }));

  // Toggle menu (mobile)
  document.querySelectorAll('.btn-toggle-menu').forEach(el=>el.addEventListener('click',()=>setState({menuOpen:!state.menuOpen})));

  // Slide dots
  document.querySelectorAll('.slide-dot').forEach(el=>el.addEventListener('click',()=>setState({slideIdx:parseInt(el.dataset.slide)})));

  // Open viewer
  document.querySelectorAll('.btn-open-viewer').forEach(el=>el.addEventListener('click',()=>{
    const id=el.dataset.id,course=state.courses.find(c=>c.id===id);
    if(course)setState({selectedCourse:course,view:'viewer'});
  }));

  // Module completion (viewer sidebar)
  document.querySelectorAll('.module-item').forEach(el=>el.addEventListener('click',function(){
    const idx=parseInt(this.dataset.idx),cid=this.dataset.course;
    const course=state.courses.find(c=>c.id===cid);
    if(!course||course.modules[idx].completed)return;
    course.modules[idx].completed=true;
    const completed=course.modules.filter(m=>m.completed).length;
    course.progress=Math.round(completed/course.modules.length*100);
    addXP(25);
    notify('Unidad completada. +25 XP','success');
    setState({selectedCourse:{...course},courses:state.courses.map(c=>c.id===cid?course:c)});
  }));
  // Back from viewer
  document.querySelectorAll('.btn-back-dashboard').forEach(el=>el.addEventListener('click',()=>setState({view:'dashboard'})));

  // Logout
  document.querySelectorAll('.btn-logout').forEach(el=>el.addEventListener('click',()=>{setState({user:null,view:'landing',tab:'dashboard',menuOpen:false});notify('Sesión cerrada con éxito.','success');}));

  // Support form
  const sf=document.querySelector('.support-form');
  if(sf){
    sf.addEventListener('submit',e=>{e.preventDefault();notify('Su ticket de soporte fue creado. Responderemos en menos de 2 horas.','success');sf.querySelector('textarea').value='';});
    document.querySelector('.input-support-cat')?.addEventListener('change',e=>setState({supportCategory:e.target.value}));
  }

  // FAQ
  document.querySelectorAll('.faq-btn').forEach(el=>el.addEventListener('click',()=>{
    const item=el.closest('.faq-item'),ans=item.querySelector('.faq-answer'),arr=item.querySelector('.faq-arrow');
    ans.classList.toggle('open');arr.classList.toggle('open');
  }));

  // Profile
  document.querySelectorAll('.btn-profile').forEach(el=>el.addEventListener('click',()=>setState({view:'profile'})));

  // Save profile
  document.querySelectorAll('.btn-save-profile').forEach(el=>el.addEventListener('click',()=>{
    const name=document.querySelector('.input-edit-name')?.value.trim()||state.user?.name||'';
    const email=document.querySelector('.input-edit-email')?.value.trim()||state.user?.email||'';
    const phone=document.querySelector('.input-edit-phone')?.value.trim()||'';
    const program=document.querySelector('.input-edit-program')?.value.trim()||'';
    const inputFile=document.querySelector('.input-avatar');
    let avatar=state.user?.avatar||'';
    if(inputFile&&inputFile.files&&inputFile.files[0]){
      const reader=new FileReader();
      reader.onload=function(e){const updated={...state.user,name,email,phone,currentProgram:program,avatar:e.target.result};setState({user:updated});notify('Cambios guardados correctamente.','success');};
      reader.readAsDataURL(inputFile.files[0]);
      return;
    }
    const updated={...state.user,name,email,phone,currentProgram:program,avatar};
    setState({user:updated});
    notify('Cambios guardados correctamente.','success');
  }));
  // Edit profile button (from dashboard perfil tab)
  document.querySelectorAll('.btn-edit-profile').forEach(el=>el.addEventListener('click',()=>setState({view:'profile'})));
  // Back to dashboard from profile
  document.querySelectorAll('.btn-to-dashboard').forEach(el=>el.addEventListener('click',()=>setState({view:'dashboard',tab:'dashboard'})));
  // Cancel profile editing
  document.querySelectorAll('.btn-cancel-profile').forEach(el=>el.addEventListener('click',()=>setState({view:'dashboard',tab:'dashboard'})));

  // Avatar preview on file select
  document.querySelectorAll('.input-avatar').forEach(el=>el.addEventListener('change',function(){
    if(this.files&&this.files[0]){
      const reader=new FileReader();
      reader.onload=function(e){
        const preview=document.querySelector('.avatar-preview');
        if(preview)preview.innerHTML=`<img src="${e.target.result}" class="w-16 h-16 rounded-full border-2 border-emerald-400 shadow-sm object-cover">`;
      };
      reader.readAsDataURL(this.files[0]);
    }
  }));

  // Notification bell
  document.querySelectorAll('.btn-notif').forEach(el=>el.addEventListener('click',()=>notify('Tienes 3 notificaciones sin leer.','info')));

  // Messages tab button (header)
  document.querySelectorAll('.btn-messages-tab').forEach(el=>el.addEventListener('click',()=>setState({tab:'mensajes'})));

  // Category filter
  document.querySelectorAll('.btn-cat-filter').forEach(el=>el.addEventListener('click',()=>setState({landingCategory:el.dataset.cat})));

  // Landing search
  document.querySelector('.input-landing-search')?.addEventListener('input',e=>setState({landingSearch:e.target.value}));

  // Newsletter
  document.querySelector('.newsletter-form')?.addEventListener('submit',e=>{e.preventDefault();notify('¡Gracias por suscribirte! Revisa tu correo para confirmar.','success');document.querySelector('.input-news-email').value='';setState({newsEmail:''});});
  document.querySelector('.input-news-email')?.addEventListener('input',e=>setState({newsEmail:e.target.value}));

  // Calendar nav
  document.querySelectorAll('.btn-cal-prev').forEach(el=>el.addEventListener('click',()=>{
    let m=state.calendarMonth-1,y=state.calendarYear;
    if(m<0){m=11;y--;}
    setState({calendarMonth:m,calendarYear:y});
  }));
  document.querySelectorAll('.btn-cal-next').forEach(el=>el.addEventListener('click',()=>{
    let m=state.calendarMonth+1,y=state.calendarYear;
    if(m>11){m=0;y++;}
    setState({calendarMonth:m,calendarYear:y});
  }));

  // Download certificates
  document.querySelectorAll('.btn-download-cert').forEach(el=>el.addEventListener('click',()=>notify('El certificado se ha descargado correctamente.','success')));
}

// ===== INIT =====
render();
</script>
</body>
</html>
